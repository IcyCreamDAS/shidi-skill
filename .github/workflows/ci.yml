name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate bundle, skill files and the AI4S example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Structure, version and link checks (stdlib only)
        run: python validate.py

      - name: JS entrypoints parse
        run: node --check index.mjs && node --check skills.mjs

      - name: Install render/test dependencies
        run: python -m pip install --quiet markdown

      - name: Script unit tests
        run: python -m unittest discover -s tests -v

      - name: render_report HTML smoke test
        run: |
          python -c "from pathlib import Path; Path('/tmp/smoke.md').write_text('# smoke\n\n| a | b |\n|---|---|\n| 1 | 2 |\n', encoding='utf-8')"
          python skills/shidi/scripts/render_report.py /tmp/smoke.md --out /tmp/render --html-only
          test -s /tmp/render/smoke.html

      - name: verify_refs offline smoke test
        run: |
          python -c "from pathlib import Path; Path('/tmp/style.md').write_text('# Title\n\nShort sentence.\n', encoding='utf-8')"
          python skills/shidi/scripts/verify_refs.py --style-only /tmp/style.md

      - name: Install example dependencies
        run: python -m pip install --quiet -r examples/materials_small_data/requirements.txt

      - name: Materials ML example smoke test
        working-directory: examples/materials_small_data
        run: |
          python run_demo.py --quick
          python run_demo.py --quick --priors priors_template.csv
